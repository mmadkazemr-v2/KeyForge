    id: lento-vivo-s03-rh-quarter-pulse
    title: "Adapted rhythm — Right hand quarter-note pulse"
    description: "Adapted practice, not an exact worksheet transcription. Practice with your right hand: play one comfortable piano key once on each of the four quarter-note beats in every 4/4 bar. KeyForge evaluates attack timing only; it cannot verify which physical hand played."
    duration: 3
    tempo:
      defaultBpm: 50
      allowUserChange: true
      minBpm: 40
      maxBpm: 70
      step: 5
      suggestedBpms: [40, 55, 70]
