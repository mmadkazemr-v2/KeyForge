id: lesson-01
title: "مبانی کیبورد"
description: "آشنایی با جغرافیای کیبورد، ریتم و نت‌خوانی پایه."
level: beginner
order: 1
estimatedMinutes: 30

unlock:
  mode: immediate

completion:
  minimumScore: 70
  requireAllExercises: true

exercises:
  - type: rhythm
    id: ex-01
    title: "ضرب‌های سیاه یکنواخت"
    description: "در سرعتی راحت، نت‌های سیاه را با ضربی یکنواخت دست بزنید و بنوازید."
    duration: 5
    tempo: 80
    difficulty: easy
    timeSignature: "4/4"
    noteValues: [quarter, eighth]
    patternCount: 4

  - type: noteReading
    id: ex-02
    title: "نت‌ها را پیدا کنید"
    description: "نت‌ها را روی حامل تشخیص دهید و جای آن‌ها را روی کیبورد پیدا کنید."
    duration: 5
    tempo: 60
    difficulty: easy
    clef: treble
    range: "C4-G5"
    keySignature: "C major"

  - type: earTraining
    id: ex-03
    title: "زیر یا بم"
    description: "گوش دهید و مشخص کنید نت دوم زیرتر است یا بم‌تر."
    duration: 4
    difficulty: easy
    taskType: pitchMatching
    rounds: 10
    keys: [C major]

  - type: interval
    id: ex-04
    title: "حرکت پله‌ای یا پرشی"
    description: "تشخیص دهید حرکت میان دو نت پله‌ای است یا پرشی."
    duration: 4
    tempo: 70
    difficulty: easy
    intervals: [M2, M3]
    direction: both
    startingNote: "C4"

  - type: octave
    id: ex-05
    title: "پرش‌های اکتاو"
    description: "پرش‌های اکتاو را در گستره کیبورد بنوازید و تشخیص دهید."
    duration: 4
    tempo: 70
    difficulty: easy
    octaves: 2
    direction: both
    startingNote: "C3"

  - type: fingerIndependence
    id: ex-06
    title: "همسایه‌های آرام"
    description: "هر انگشت را پایین نگه دارید و انگشتان کناری را بی‌حرکت حفظ کنید."
    duration: 4
    tempo: 60
    difficulty: easy
    fingers: [2, 3, 4]
    hand: both

  - type: mentalKeyboard
    id: ex-07
    title: "جغرافیای کیبورد"
    description: "بدون نگاه‌کردن به کلیدها، جای نت‌ها را در ذهن مجسم کنید."
    duration: 3
    difficulty: easy
    startingNote: "C4"
    direction: ascending
    steps: 4

  - type: speed
    id: ex-08
    title: "حرکت پنج‌انگشتی"
    description: "یک الگوی پنج‌انگشتی را به‌تدریج سریع‌تر بنوازید."
    duration: 3
    tempo: 70
    difficulty: easy
    pattern: scale
    targetTempo: 110
    repetitions: 10
