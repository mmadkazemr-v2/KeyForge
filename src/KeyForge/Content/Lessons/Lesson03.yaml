id: lesson-03
title: "گوش ملودیک و استقلال انگشتان"
description: "تربیت شنوایی، استقلال انگشتان و تمرین اکتاو برای هر دو دست."
level: elementary
order: 3
estimatedMinutes: 35

unlock:
  mode: prerequisitesCompleted
  requiredLessonIds:
    - lesson-01
    - lesson-02

completion:
  minimumScore: 80
  requireAllExercises: true

exercises:
  - type: earTraining
    id: ex-01
    title: "آکورد ماژور یا مینور"
    description: "گوش دهید و تشخیص دهید آکورد ماژور است یا مینور."
    duration: 6
    difficulty: easy
    taskType: chordRecognition
    rounds: 10
    keys: [C major, G major]

  - type: interval
    id: ex-02
    title: "تطبیق ملودی‌ها"
    description: "فاصله‌ها را در عبارت‌های ملودیک کوتاه تشخیص دهید."
    duration: 5
    tempo: 72
    difficulty: easy
    intervals: [M2, M3, P5]
    direction: ascending
    startingNote: "C4"

  - type: fingerIndependence
    id: ex-03
    title: "انگشت سوم و چهارم"
    description: "انگشتان سوم و چهارم هر دست را به‌صورت مستقل تمرین دهید."
    duration: 5
    tempo: 60
    difficulty: easy
    fingers: [3, 4]
    hand: both

  - type: octave
    id: ex-04
    title: "پرش اکتاو با هر دو دست"
    description: "پرش‌های اکتاو را با هر دو دست به‌طور هم‌زمان بنوازید."
    duration: 5
    tempo: 76
    difficulty: easy
    octaves: 2
    direction: ascending
    startingNote: "C3"

  - type: mentalKeyboard
    id: ex-05
    title: "جایگاه نت‌ها"
    description: "پیش از نواختن، جایگاه نت‌های گام را در ذهن مجسم کنید."
    duration: 4
    difficulty: easy
    startingNote: "G3"
    direction: ascending
    steps: 6

  - type: speed
    id: ex-06
    title: "حرکت سریع اکتاو"
    description: "پرش‌های اکتاو را با سرعتی یکنواخت و کنترل‌شده بنوازید."
    duration: 4
    tempo: 84
    difficulty: medium
    pattern: repeatedNote
    targetTempo: 120
    repetitions: 8
